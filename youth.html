<!DOCTYPE html>
<html lang="fa" dir="rtl">

  <head>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>نوجوانی و جوانی | جعفر رحم‌دل</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #111111;
      color: #eeeeee;
      font-family: sans-serif;
      text-align: center;
    }

    .album-page {
      padding: 50px 15px;
    }

    h1 {
      font-family: 'Vazirmatn', sans-serif;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #eeeeee;
      margin-bottom: 35px;
    }
    
.gallery {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.gallery img {
  width: 100%;
  height: 150px;
  object-fit: cover;
  border-radius: 10px;
  display: block;
}
    
    .lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0);
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 20px;
  backdrop-filter: blur(0px);
  transition: background 0.35s ease, backdrop-filter 0.35s ease;
}

.lightbox img {
  max-width: 90%;
  max-height: 85vh;
  width: auto;
  height: auto;
  border-radius: 12px;
  opacity: 0;
  transform: scale(0.75);
  transition: opacity 0.35s ease, transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
}

.lightbox-close {
  position: absolute;
  top: 18px;
  right: 22px;
  font-size: 32px;
  color: #eeeeee;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.lightbox img {
  max-width: 90%;
  max-height: 85vh;
  width: auto;
  height: auto;
  border-radius: 10px;
}

.lightbox-close {
  position: absolute;
  top: 18px;
  right: 22px;
  font-size: 32px;
  color: #eeeeee;
  cursor: pointer;
}

    .lightbox.show {
  display: flex;
  background: rgba(0, 0, 0, 0.92);
  backdrop-filter: blur(8px);
}

.lightbox.show img {
  opacity: 1;
  transform: scale(1);
}

.lightbox.show .lightbox-close {
  opacity: 1;
}
    
  </style>
  </head>
  
<body>

  <div class="album-page">

    <h1>نوجوانی و جوانی</h1>

<div class="gallery">
  <img src="albums/youth/IMG_20260924_053150_197.jpg" alt="نوجوانی و جوانی">
  <img src="albums/youth/IMG_20260924_053155_026.jpg" alt="نوجوانی و جوانی">
  <img src="albums/youth/IMG_20260924_053200_967.jpg" alt="نوجوانی و جوانی">
  <img src="albums/youth/IMG_20260924_053202_992.jpg" alt="نوجوانی و جوانی">
  <img src="albums/youth/IMG_20260924_053206_035.jpg" alt="نوجوانی و جوانی">
  <img src="albums/youth/IMG_20260924_053208_158.jpg" alt="نوجوانی و جوانی">
  <img src="albums/youth/IMG_20260924_053210_654.jpg" alt="نوجوانی و جوانی">
  <img src="albums/youth/IMG_20260924_053213_266.jpg" alt="نوجوانی و جوانی">
  <img src="albums/youth/IMG_20260924_053229_300.jpg" alt="نوجوانی و جوانی">
</div>
    
  </div>
  
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close">×</span>
  <img id="lightboxImage" src="" alt="">
</div>

<script>
document.querySelectorAll(".gallery img").forEach(function(img) {
  img.onclick = function() {
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");

    lightboxImage.src = this.src;
    lightbox.style.display = "flex";

    setTimeout(function() {
      lightbox.classList.add("show");
    }, 10);
  };
});

function closeLightbox() {
  const lightbox = document.getElementById("lightbox");

  lightbox.classList.remove("show");

  setTimeout(function() {
    lightbox.style.display = "none";
  }, 350);
}
</script>
  
</body>
</html>
