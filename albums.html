<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>آلبوم خاطرات | جعفر رحم‌دل</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;500&family=Vazirmatn:wght@300;400;500&display=swap" rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #f5f5f5;
      font-family: "Vazirmatn", sans-serif;
    }

    .page-header {
      text-align: center;
      padding: 55px 20px 35px;
    }

    .page-title {
      font-family: "Noto Nastaliq Urdu", serif;
      font-size: 34px;
      margin-bottom: 5px;
    }

    .page-subtitle {
      font-family: "Cormorant Garamond", serif;
      font-size: 17px;
      letter-spacing: 4px;
      color: #999;
    }

    .albums-container {
      width: 92%;
      max-width: 800px;
      margin: 0 auto;
      padding-bottom: 60px;
    }

    .albums-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .album-card {
      background: #1a1a1a;
      border: 1px solid #292929;
      border-radius: 15px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.25s;
    }

    .album-card:hover {
      transform: translateY(-3px);
      background: #202020;
    }

    .album-cover {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #292929;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
      color: #777;
      overflow: hidden;
    }

    .album-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .album-name {
      text-align: center;
      padding: 14px 5px 17px;
      font-size: 14px;
    }

    /* صفحه داخل آلبوم */

    #albumPage {
      display: none;
      width: 92%;
      max-width: 800px;
      margin: 0 auto;
      padding-bottom: 60px;
    }

    .back-button {
      display: block;
      background: none;
      border: none;
      color: #ddd;
      font-family: "Vazirmatn", sans-serif;
      font-size: 15px;
      cursor: pointer;
      padding: 10px 0;
      margin-bottom: 20px;
    }

    .album-title {
      text-align: center;
      font-family: "Noto Nastaliq Urdu", serif;
      font-size: 30px;
      margin-bottom: 30px;
    }

    .photos-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .empty-message {
      grid-column: 1 / -1;
      text-align: center;
      color: #777;
      padding: 60px 20px;
    }

    /* نمایش بزرگ عکس */

    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,0.95);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #lightbox img {
      max-width: 95%;
      max-height: 82vh;
      object-fit: contain;
      border-radius: 8px;
    }

    .close-button {
      position: absolute;
      top: 15px;
      right: 20px;
      color: white;
      font-size: 38px;
      cursor: pointer;
    }

    .lightbox-caption {
      position: absolute;
      bottom: 20px;
      width: 90%;
      text-align: center;
      color: #ddd;
      font-size: 14px;
    }

    @media (max-width: 600px) {

      .page-header {
        padding-top: 45px;
      }

      .page-title {
        font-size: 30px;
      }

      .albums-grid,
      .photos-grid {
        gap: 12px;
      }

      .album-name {
        font-size: 13px;
      }

    }

  </style>
</head>


<body>


<!-- =========================
     صفحه اصلی آلبوم‌ها
========================= -->

<section id="albumsHome">

  <header class="page-header">

    <div class="page-title">
      آلبوم خاطرات
    </div>

    <div class="page-subtitle">
      MEMORIES
    </div>

  </header>


  <main class="albums-container">

    <div class="albums-grid">


      <!-- ۱ -->

      <div class="album-card" onclick="openAlbum('youth')">

        <div class="album-cover">
          <img
            src="Albums/youth/cover.jpg"
            alt="نوجوانی و جوانی"
            onerror="this.style.display='none'; this.parentElement.innerHTML='📷';">
        </div>

        <div class="album-name">
          نوجوانی و جوانی
        </div>

      </div>


      <!-- ۲ -->

      <div class="album-card" onclick="openAlbum('lovelyDays')">

        <div class="album-cover">
          <img
            src="Albums/lovely-days/cover.jpg"
            alt="روزهای دوست داشتنی"
            onerror="this.style.display='none'; this.parentElement.innerHTML='📷';">
        </div>

        <div class="album-name">
          روزهای دوست داشتنی
        </div>

      </div>


      <!-- ۳ -->

      <div class="album-card" onclick="openAlbum('lovedOnes')">

        <div class="album-cover">
          <img
            src="Albums/loved-ones/cover.jpg"
            alt="او و عزیزانش"
            onerror="this.style.display='none'; this.parentElement.innerHTML='📷';">
        </div>

        <div class="album-name">
          او و عزیزانش
        </div>

      </div>


      <!-- ۴ -->

      <div class="album-card" onclick="openAlbum('travels')">

        <div class="album-cover">
          <img
            src="Albums/travels/cover.jpg"
            alt="سفرها"
            onerror="this.style.display='none'; this.parentElement.innerHTML='📷';">
        </div>

        <div class="album-name">
          سفرها
        </div>

      </div>


      <!-- ۵ -->

      <div class="album-card" onclick="openAlbum('memorableFrames')">

        <div class="album-cover">
          <img
            src="Albums/memorable-frames/cover.jpg"
            alt="قاب‌های ماندگار"
            onerror="this.style.display='none'; this.parentElement.innerHTML='📷';">
        </div>

        <div class="album-name">
          قاب‌های ماندگار
        </div>

      </div>


      <!-- ۶ -->

      <div class="album-card" onclick="openAlbum('videos')">

        <div class="album-cover">
          🎥
        </div>

        <div class="album-name">
          ویدیوها
        </div>

      </div>


    </div>

  </main>

</section>



<!-- =========================
     داخل آلبوم
========================= -->

<section id="albumPage">

  <button class="back-button" onclick="backToAlbums()">
    ← بازگشت به آلبوم‌ها
  </button>

  <div id="albumTitle" class="album-title"></div>

  <div id="photosGrid" class="photos-grid"></div>

</section>



<!-- =========================
     نمایش بزرگ عکس
========================= -->

<div id="lightbox" onclick="closeLightbox()">

  <span class="close-button">
    ×
  </span>

  <img id="lightboxImage" src="" alt="">

  <div id="lightboxCaption" class="lightbox-caption"></div>

</div>



<script>

  const albums = {

    youth: {
      title: "نوجوانی و جوانی",
      photos: []
    },

    lovelyDays: {
      title: "روزهای دوست داشتنی",
      photos: []
    },

    lovedOnes: {
      title: "او و عزیزانش",
      photos: []
    },

    travels: {
      title: "سفرها",
      photos: []
    },

    memorableFrames: {
      title: "قاب‌های ماندگار",
      photos: []
    },

    videos: {
      title: "ویدیوها",
      photos: []
    }

  };


  function openAlbum(id) {

    const album = albums[id];

    document.getElementById("albumsHome").style.display = "none";

    document.getElementById("albumPage").style.display = "block";

    document.getElementById("albumTitle").textContent = album.title;

    const grid = document.getElementById("photosGrid");

    grid.innerHTML = "";


    if (album.photos.length === 0) {

      grid.innerHTML = `
        <div class="empty-message">
          هنوز خاطره‌ای به این آلبوم اضافه نشده
        </div>
      `;

      return;
    }


    album.photos.forEach(photo => {

      const card = document.createElement("div");

      const image = document.createElement("img");

      image.src = photo.image;

      image.alt = photo.caption;

      image.style.width = "100%";

      image.style.borderRadius = "14px";

      image.style.cursor = "pointer";

      image.onclick = function() {

        openLightbox(
          photo.image,
          photo.caption
        );

      };


      const caption = document.createElement("div");

      caption.textContent = photo.caption;

      caption.style.textAlign = "center";

      caption.style.color = "#ccc";

      caption.style.marginTop = "8px";


      card.appendChild(image);

      card.appendChild(caption);

      grid.appendChild(card);

    });

  }


  function backToAlbums() {

    document.getElementById("albumPage").style.display = "none";

    document.getElementById("albumsHome").style.display = "block";

    window.scrollTo(0, 0);

  }


  function openLightbox(image, caption) {

    document.getElementById("lightboxImage").src = image;

    document.getElementById("lightboxCaption").textContent = caption;

    document.getElementById("lightbox").style.display = "flex";

  }


  function closeLightbox() {

    document.getElementById("lightbox").style.display = "none";

  }

</script>


</body>
</html>
