<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>روزهای دوست داشتنی</title>

  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #111111;
      color: #eeeeee;
      font-family: sans-serif;
      text-align: center;
    }

    .album-page {
      padding: 50px 15px;
    }

    h1 {
      font-family: 'Vazirmatn', sans-serif;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #eeeeee;
      margin-bottom: 35px;
    }

    .gallery {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .gallery img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
      cursor: pointer;
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0);
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
      backdrop-filter: blur(0px);
      transition: background 0.35s ease, backdrop-filter 0.35s ease;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 85vh;
      width: auto;
      height: auto;
      border-radius: 12px;
      opacity: 0;
      transform: scale(0.75);
      transition: opacity 0.35s ease,
                  transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .lightbox-close {
      position: absolute;
      top: 18px;
      right: 22px;
      font-size: 32px;
      color: #eeeeee;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .lightbox.show {
      display: flex;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
    }

    .lightbox.show img {
      opacity: 1;
      transform: scale(1);
    }

    .lightbox.show .lightbox-close {
      opacity: 1;
    }
  </style>
</head>

<body>

  <div class="album-page">

    <h1>روزهای دوست داشتنی</h1>

    <div class="gallery">

      <img src="albums/lovely-days/IMG_20260924_144619_610.jpg" alt="روزهای دوست داشتنی">
      <img src="albums/lovely-days/IMG_20260924_144621_377.jpg" alt="روزهای دوست داشتنی">
      <img src="albums/lovely-days/IMG_20260924_144659_958.jpg" alt="روزهای دوست داشتنی">
      <img src="albums/lovely-days/IMG_20260924_144702_714.jpg" alt="روزهای دوست داشتنی">
      <img src="albums/lovely-days/IMG_20260924_144708_010.jpg" alt="روزهای دوست داشتنی">
      <img src="albums/lovely-days/IMG_20260924_144709_618.jpg" alt="روزهای دوست داشتنی">
      <img src="albums/lovely-days/IMG_20260924_144716_420.jpg" alt="روزهای دوست داشتنی">
      <img src="albums/lovely-days/IMG_20260924_144725_835.jpg" alt="روزهای دوست داشتنی">
      <img src="albums/lovely-days/IMG_20260924_144735_070.jpg" alt="روزهای دوست داشتنی">
      <img src="albums/lovely-days/IMG_20260924_144737_270.jpg" alt="روزهای دوست داشتنی">
      <img src="albums/lovely-days/IMG_20260924_144739_513.jpg" alt="روزهای دوست داشتنی">
      <img src="albums/lovely-days/IMG_20260924_144741_847.jpg" alt="روزهای دوست داشتنی">
      <img src="albums/lovely-days/IMG_20260924_144753_274.jpg" alt="روزهای دوست داشتنی">
      <img src="albums/lovely-days/IMG_20260924_144802_450.jpg" alt="روزهای دوست داشتنی">
      <img src="albums/lovely-days/IMG_20260924_144806_047.jpg" alt="روزهای دوست داشتنی">
      <img src="albums/lovely-days/IMG_20260924_144811_548.jpg" alt="روزهای دوست داشتنی">
      <img src="albums/lovely-days/IMG_20260924_144814_835.jpg" alt="روزهای دوست داشتنی">

    </div>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">×</span>
    <img id="lightboxImage" src="" alt="">
  </div>

  <script>
    document.querySelectorAll(".gallery img").forEach(function(img) {
      img.onclick = function() {
        const lightbox = document.getElementById("lightbox");
        const lightboxImage = document.getElementById("lightboxImage");

        lightboxImage.src = this.src;
        lightbox.style.display = "flex";

        setTimeout(function() {
          lightbox.classList.add("show");
        }, 10);
      };
    });

    function closeLightbox() {
      const lightbox = document.getElementById("lightbox");

      lightbox.classList.remove("show");

      setTimeout(function() {
        lightbox.style.display = "none";
      }, 350);
    }
  </script>

</body>
</html>
